<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#213a34"><title>HANA WORK OS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f6f5;color:#1d302a}header{background:#213a34;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}header p{margin:4px 0 12px;color:#cbd9d4;font-size:12px}.nav{display:flex;gap:7px;overflow:auto}.nav button,.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.nav button{background:#ffffff18;color:white;white-space:nowrap}.nav button.on{background:white;color:#213a34}.btn{background:white;border:1px solid #dce5e1}.primary{background:#213a34;color:white;border-color:#213a34}main{max-width:1100px;margin:auto;padding:16px 14px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0 14px}.top h2{margin:0;font-size:20px}.muted{font-size:12px;color:#73817c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border:1px solid #dfe7e3;border-radius:16px;padding:14px;box-shadow:0 7px 22px #17352b0b}.stat b{display:block;font-size:25px;margin-top:5px}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:13px}.cat{border-left:6px solid var(--c);cursor:pointer}.cat h3{margin:0 0 4px}.bar{height:7px;background:#e8eeeb;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--c)}.project{padding:12px 0;border-top:1px solid #e2e9e6}.project:first-child{border-top:0}.project h4{margin:0 0 4px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:9px 0;border-top:1px solid #e6ece9;align-items:start}.task.done .title{text-decoration:line-through;color:#8a9792}.title{font-size:13px;font-weight:750}.meta{font-size:11px;color:#76827e;margin-top:3px}.view{display:none}.view.on{display:block}.quick{display:flex;gap:8px;margin:12px 0}.quick input{flex:1;border:1px solid #dce5e1;border-radius:10px;padding:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row input,.row select,dialog input,dialog select,dialog textarea{border:1px solid #dce5e1;border-radius:9px;padding:9px;background:#fff}dialog{border:0;border-radius:16px;width:min(620px,calc(100% - 24px));padding:0;box-shadow:0 30px 80px #0005}dialog::backdrop{background:#15251f99}.modal{padding:18px}.modal h3{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#76827e}.field textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.empty{text-align:center;color:#7a8782;padding:20px}.section{margin-top:12px}.badge{display:inline-block;font-size:10px;border-radius:99px;padding:3px 7px;background:#eef3f0}.high{background:#fdeaea;color:#9d4141}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.cats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header><h1>HANA WORK OS</h1><p>전체 업무 · 프로젝트 · 세부업무 관리</p><div class="nav"><button data-v="home" class="on">전체 대시보드</button><button data-v="today">오늘 / 이번 주</button><button data-v="all">전체 업무</button><button data-v="backup">백업</button></div></header><main><section id="home" class="view on"></section><section id="today" class="view"></section><section id="all" class="view"></section><section id="detail" class="view"></section><section id="backup" class="view"></section></main><dialog id="dlg"><form class="modal" id="form"><h3>세부업무</h3><input type="hidden" name="id"><div class="form"><div class="field full"><label>업무명</label><input name="title" required></div><div class="field"><label>큰 분류</label><select name="cat" id="catSel"></select></div><div class="field"><label>프로젝트</label><select name="proj" id="projSel"></select></div><div class="field"><label>마감일</label><input type="date" name="due"></div><div class="field"><label>우선순위</label><select name="priority"><option>높음</option><option selected>보통</option><option>낮음</option></select></div><div class="field"><label>상태</label><select name="status"><option>진행중</option><option>대기</option><option>완료</option></select></div><div class="field full"><label>메모</label><textarea name="note"></textarea></div></div><div class="actions"><button type="button" class="btn" onclick="dlg.close()">취소</button><button class="btn primary">저장</button></div></form></dialog><script>const KEY='hana-work-os';const sample={cats:[{id:'wecan',name:'WECAN',desc:'공공 웰니스 행사 · 사업개발',color:'#397861'},{id:'thek',name:'더케이도시문화 · YA',desc:'대행사 · 행사 운영 실무',color:'#426b8a'},{id:'kafa',name:'KAFA',desc:'KBC 병원 · 웨인박스 · 홍보',color:'#9c6a35'},{id:'career',name:'강의 · 개인브랜딩',desc:'겸임교수 · AI마케팅 · 콘텐츠',color:'#7b5a91'},{id:'hyunho',name:'김현호 · 코레아아트',desc:'공연 · 브랜딩 · 문화 프로그램',color:'#9b4e59'},{id:'personal',name:'개인 · 가족',desc:'개인 일정 · 가족 · 행정',color:'#5d6771'}],projects:[{id:'w1',cat:'wecan',name:'강남구 공공 웰니스 힐링행사',status:'진행중',progress:45,due:'2026-10-24'},{id:'w2',cat:'wecan',name:'wecanwellness.kr 브랜드/웹사이트',status:'진행중',progress:75,due:''},{id:'w3',cat:'wecan',name:'공공기관 대상 SNS 운영',status:'진행중',progress:30,due:''},{id:'t1',cat:'thek',name:'2026 Korea Trusted Innovation Award',status:'진행중',progress:85,due:'2026-09-29'},{id:'t2',cat:'thek',name:'행사/MC 운영 실무',status:'진행중',progress:40,due:''},{id:'k1',cat:'kafa',name:'웨인박스 후원 프로젝트',status:'진행중',progress:55,due:''},{id:'k2',cat:'kafa',name:'KAFA 뉴스레터 · 홍보',status:'진행중',progress:45,due:''},{id:'k3',cat:'kafa',name:'KBC 병원 프로젝트',status:'대기',progress:55,due:''},{id:'c1',cat:'career',name:'겸임교수 / AI마케팅 강의 준비',status:'진행중',progress:25,due:''},{id:'c2',cat:'career',name:'K-Culture & Korea Travel Curator 브랜딩',status:'진행중',progress:35,due:''},{id:'h1',cat:'hyunho',name:'김현호 공연 · 브랜딩',status:'진행중',progress:45,due:''},{id:'h2',cat:'hyunho',name:'The Sound of Korea',status:'대기',progress:60,due:''},{id:'p1',cat:'personal',name:'챙겨야 될 사람 리스트',status:'진행중',progress:10,due:''},{id:'p2',cat:'personal',name:'건물 / 행정 업무',status:'진행중',progress:35,due:''}],tasks:[{id:'a1',cat:'wecan',proj:'w1',title:'강남구 힐링행사 프로그램 구성 확정',due:'2026-10-05',priority:'높음',status:'진행중',note:''},{id:'a2',cat:'wecan',proj:'w1',title:'예산 500만원 기준 세부 견적 정리',due:'2026-10-05',priority:'높음',status:'진행중',note:''},{id:'a3',cat:'wecan',proj:'w3',title:'화·목·토 카드뉴스 운영 점검',due:'',priority:'보통',status:'진행중',note:''},{id:'a4',cat:'thek',proj:'t1',title:'시상식 순번 · 11th 표기 · 분야 삭제 최종 확인',due:'2026-09-28',priority:'높음',status:'진행중',note:''},{id:'a5',cat:'kafa',proj:'k1',title:'웨인박스 후원영상 나레이션 · QR 최종 정리',due:'',priority:'높음',status:'진행중',note:''},{id:'a6',cat:'kafa',proj:'k2',title:'의료+교육 2축 후원 메시지 정리',due:'',priority:'보통',status:'진행중',note:''},{id:'a7',cat:'career',proj:'c1',title:'AI마케팅 강의 1회차 커리큘럼 초안',due:'',priority:'보통',status:'진행중',note:''},{id:'a8',cat:'hyunho',proj:'h1',title:'김현호 행사 출연 프로필 문구 정리',due:'',priority:'보통',status:'진행중',note:''},{id:'a9',cat:'personal',proj:'p1',title:'챙겨야 될 사람 리스트 업데이트',due:'',priority:'낮음',status:'진행중',note:''}]};let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(sample)}catch(e){s=structuredClone(sample)}let activeCat='';const $=q=>document.querySelector(q),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function cat(id){return s.cats.find(x=>x.id===id)}function proj(id){return s.projects.find(x=>x.id===id)}function openTasks(){return s.tasks.filter(x=>x.status!=='완료')}function td(){return new Date().toISOString().slice(0,10)}function p7(){let d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)}function top(a,b,c=''){return `<div class="top"><div><h2>${a}</h2><div class="muted">${b}</div></div>${c}</div>`}function task(t){let p=proj(t.proj);return `<div class="task ${t.status==='완료'?'done':''}"><input type="checkbox" ${t.status==='완료'?'checked':''} onchange="toggle('${t.id}',this.checked)"><div><div class="title">${esc(t.title)}</div><div class="meta">${esc(cat(t.cat)?.name||'')} · ${esc(p?.name||'프로젝트 미지정')}${t.due?' · '+t.due:''} · <span class="badge ${t.priority==='높음'?'high':''}">${t.priority}</span></div></div><button class="btn" onclick="edit('${t.id}')">수정</button></div>`}function catCard(c){let ps=s.projects.filter(p=>p.cat===c.id),ts=openTasks().filter(t=>t.cat===c.id),avg=ps.length?Math.round(ps.reduce((a,p)=>a+(+p.progress||0),0)/ps.length):0;return `<div class="card cat" style="--c:${c.color}" onclick="openCat('${c.id}')"><h3>${esc(c.name)}</h3><div class="muted">${esc(c.desc)}</div><div class="bar"><i style="width:${avg}%"></i></div><div class="meta">프로젝트 ${ps.length}개 · 남은 업무 ${ts.length}개 · 평균 ${avg}%</div></div>`}function home(){let done=s.tasks.filter(t=>t.status==='완료').length;$('#home').innerHTML=top('전체 대시보드','지금 하고 있는 일을 한눈에 봅니다.','<button class="btn primary" onclick="newTask()">+ 업무 추가</button>')+`<div class="stats"><div class="card stat"><span class="muted">큰 분류</span><b>${s.cats.length}</b></div><div class="card stat"><span class="muted">진행 프로젝트</span><b>${s.projects.filter(p=>p.status==='진행중').length}</b></div><div class="card stat"><span class="muted">남은 업무</span><b>${openTasks().length}</b></div><div class="card stat"><span class="muted">완료 업무</span><b>${done}</b></div></div><div class="quick"><input id="quick" placeholder="생각난 업무를 바로 적기"><button class="btn primary" onclick="quick()">추가</button></div><div class="cats">${s.cats.map(catCard).join('')}</div>`}function today(){let o=openTasks(),a=o.filter(t=>t.due===td()),b=o.filter(t=>t.due&&t.due>td()&&t.due<=p7()),c=o.filter(t=>!t.due);$('#today').innerHTML=top('오늘 / 이번 주','마감이 가까운 일을 먼저 봅니다.','<button class="btn primary" onclick="newTask()">+ 업무 추가</button>')+`<div class="card"><h3>오늘 마감 · ${a.length}</h3>${a.map(task).join('')||'<div class="empty">없습니다.</div>'}</div><div class="card section"><h3>7일 이내 · ${b.length}</h3>${b.map(task).join('')||'<div class="empty">없습니다.</div>'}</div><div class="card section"><h3>마감일 미정 · ${c.length}</h3>${c.map(task).join('')||'<div class="empty">없습니다.</div>'}</div>`}function all(){let arr=s.tasks;$('#all').innerHTML=top('전체 업무','모든 업무를 한곳에서 관리합니다.','<button class="btn primary" onclick="newTask()">+ 업무 추가</button>')+`<div class="card">${arr.map(task).join('')}</div>`}function detail(){let c=cat(activeCat);if(!c)return;let ps=s.projects.filter(p=>p.cat===c.id);$('#detail').innerHTML=top(c.name,c.desc,'<button class="btn primary" onclick="newTask(\''+c.id+'\')">+ 업무 추가</button>')+`<div class="card">${ps.map(p=>`<div class="project"><h4>${esc(p.name)}</h4><div class="meta">${p.status}${p.due?' · 마감 '+p.due:''} · 진행률 ${p.progress}%</div><div class="bar"><i style="width:${p.progress}%;background:${c.color}"></i></div>${s.tasks.filter(t=>t.proj===p.id).map(task).join('')||'<div class="empty">세부업무가 없습니다.</div>'}</div>`).join('')}</div>`}function backup(){let json=encodeURIComponent(JSON.stringify(s,null,2));$('#backup').innerHTML=top('백업','데이터는 현재 이 브라우저에 자동 저장됩니다.')+`<div class="card"><a class="btn primary" download="HANA_WORK_OS_backup.json" href="data:application/json;charset=utf-8,${json}" style="display:inline-block;text-decoration:none">백업 파일 받기</a> <button class="btn" onclick="if(confirm('초기화할까요?')){s=structuredClone(sample);save()}">처음 데이터 복원</button></div>`}function render(){home();today();all();if(activeCat)detail();backup()}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));scrollTo(0,0)}function openCat(id){activeCat=id;detail();show('detail')}function toggle(id,d){let t=s.tasks.find(x=>x.id===id);if(t)t.status=d?'완료':'진행중';save()}function sync(selected=''){let cid=catSel.value;projSel.innerHTML='<option value="">프로젝트 미지정</option>'+s.projects.filter(p=>p.cat===cid).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}catSel.onchange=()=>sync();function newTask(cid=''){form.reset();form.id.value='';catSel.innerHTML=s.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');catSel.value=cid||activeCat||s.cats[0].id;sync();form.status.value='진행중';form.priority.value='보통';dlg.showModal()}function edit(id){let t=s.tasks.find(x=>x.id===id);newTask(t.cat);for(let k in t)if(form.elements[k])form.elements[k].value=t[k];sync(t.proj);dlg.showModal()}form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form).entries());if(o.id){let i=s.tasks.findIndex(x=>x.id===o.id);s.tasks[i]=o}else{o.id='t'+Date.now();s.tasks.push(o)}dlg.close();save()};function quick(){let i=$('#quick'),title=i.value.trim();if(!title)return;s.tasks.push({id:'t'+Date.now(),cat:'personal',proj:'',title,due:'',priority:'보통',status:'진행중',note:'빠른 추가'});i.value='';save()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));render();</script></body></html>
